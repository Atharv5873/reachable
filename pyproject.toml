[project]
name = "reachable"
version = "0.1.0"
description = "Triage security findings by what an attacker can actually reach, on FalkorDB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reachable-core",
    "reachable-intel",
    "reachable-orggen",
    "reachable-api",
    "reachable-graph",
    "reachable-mcp",
    "reachable-agents",
]

# uv workspace: each folder below is its own installable package, so the API
# container can install core+api only and never drags the data-gen / intel
# toolchain (networkx, httpx, pandas) along for the ride.
[tool.uv.workspace]
members = [
    "packages/core",
    "packages/intel",
    "packages/orggen",
    "packages/graph",
    "apps/api",
    "packages/agents",
    "apps/mcp",
]

[tool.uv.sources]
reachable-core = { workspace = true }
reachable-intel = { workspace = true }
reachable-orggen = { workspace = true }
reachable-api = { workspace = true }
reachable-graph = { workspace = true }
reachable-mcp = { workspace = true }
reachable-agents = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running FalkorDB (make up)",
]

[tool.ruff.lint.isort]
known-first-party = [
    "reachable_core",
    "reachable_intel",
    "reachable_orggen",
    "reachable_graph",
    "reachable_api",
    "reachable_mcp",
    "reachable_agents",
]
