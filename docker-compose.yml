name: reachable

# Host ports are deliberately offset from the defaults (6379/3000/5432/8000)
# so this stack can run next to other FalkorDB/Postgres projects on the same
# machine without clashing. Inside the compose network, services still talk on
# the standard container ports (6379, 5432, 8000) by service name.

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_PORT:-6380}:6379"              # Redis protocol (clients, redis-cli)
      - "${FALKORDB_BROWSER_PORT:-3001}:3000"      # FalkorDB Browser UI
    environment:
      # AOF persistence: every write is appended to a log and fsynced each
      # second, so the graphs survive `docker compose down` and restarts.
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD} --appendonly yes --appendfsync everysec"
      # Setting FALKORDB_ARGS *replaces* the image default, which bundles
      # TIMEOUT 1000 (1s). That is far too tight for bulk UNWIND loads and for
      # exploratory multi-hop path queries in the Browser, so we set the
      # read/write timeouts explicitly. TIMEOUT_DEFAULT applies when a query
      # does not pass its own; TIMEOUT_MAX caps what a query may request.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 300000 RESULTSET_SIZE 10000"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}      # read by the healthcheck below
    volumes:
      # The image's data dir is FALKORDB_DATA_PATH=/var/lib/falkordb/data
      # (confirmed with `docker inspect`). Several doc examples say /data,
      # which this image does NOT use, so mounting there loses data on restart.
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FALKORDB_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    # Baseline-only mirror (S7 SQL / pgvector comparison). NOT the primary
    # store. FalkorDB does the real work; this exists so later stages can
    # compare graph traversal against relational joins on identical data.
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8001}:8000"
    env_file: .env
    environment:
      # Inside the compose network, services reach each other by service name
      # on their container ports, not the host-mapped ones.
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      # GET /evals serves the latest eval results without an image rebuild.
      - ./evals/results:/app/evals/results:ro
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; urlopen raises (exit 1) on a 503 from /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp:
    # The typed graph tools over MCP (streamable HTTP at /mcp). Every request
    # needs `Authorization: Bearer $MCP_API_KEY` or `X-API-Key: $MCP_API_KEY`;
    # the server refuses to start without a key. /health is open.
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "${MCP_PORT:-8002}:8002"
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # Host headers accepted (DNS-rebinding protection): host-side localhost
      # plus the compose service name for other containers.
      MCP_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mcp:*"
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  falkordb_data:
  postgres_data:
