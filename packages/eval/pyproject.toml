[project]
name = "reachable-eval"
version = "0.1.0"
description = "S7 comparison eval: five prioritisers on the same findings, scored against the oracle"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reachable-core",
    "reachable-graph",
    "reachable-agents",
    "reachable-mcp",
    "psycopg[binary]>=3.2",
    "litellm>=1.70",
    "fastembed>=0.5",
]

[tool.uv.sources]
reachable-core = { workspace = true }
reachable-graph = { workspace = true }
reachable-agents = { workspace = true }
reachable-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachable_eval"]
