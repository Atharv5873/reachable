[project]
name = "reachable-orggen"
version = "0.1.0"
description = "Synthetic org generator, ground-truth planters, networkx oracle and loaders"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reachable-core",
    "reachable-intel",
    "networkx>=3.3",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
reachable-core = { workspace = true }
reachable-intel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachable_orggen"]
