[project]
name = "reachable-intel"
version = "0.1.0"
description = "Fetch, normalise and load public threat intel (KEV, EPSS, NVD, ATT&CK)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reachable-core",
    "httpx>=0.27",
]

[tool.uv.sources]
reachable-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachable_intel"]
