[project]
name = "reachable-graph"
version = "0.1.0"
description = "ATTACK_STEP derivation and the read-only Cypher tool library over FalkorDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reachable-core",
    "pydantic>=2.9",
]

[tool.uv.sources]
reachable-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachable_graph"]
