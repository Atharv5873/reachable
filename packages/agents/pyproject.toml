[project]
name = "reachable-agents"
version = "0.1.0"
description = "The agent layer: LiteLLM router, LangGraph agents over the MCP tools, run tracing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reachable-core",
    "reachable-graph",
    "reachable-mcp",
    "langgraph>=0.6",
    "litellm>=1.70",
]

[tool.uv.sources]
reachable-core = { workspace = true }
reachable-graph = { workspace = true }
reachable-mcp = { workspace = true }

[project.scripts]
reachable-triage = "reachable_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachable_agents"]
