[project]
name = "reachable-core"
version = "0.1.0"
description = "Shared settings, schema, FalkorDB helpers and attack rules for Reachable"
requires-python = ">=3.12,<3.13"
dependencies = [
    "falkordb>=1.0.10",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachable_core"]
